<meta charset="utf-8">
<title>Son Gün</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Saira+Stencil+One&display=swap">
<style>
:root{
  color-scheme:dark;
  --void:#05060a;
  --bone:#ece6da;
  --bone-2:#cfc8bb;
  --dim:#948c7f;
  --faint:rgba(236,230,218,.09);
  --line:rgba(236,230,218,.14);
  --line-hi:rgba(236,230,218,.34);
  --panel:rgba(9,9,12,.58);
  --ember:#ff4d1a;
  --sulfur:#f2b84b;
  --frost:#9cc3dc;
  --display:"Saira Stencil One","Impact","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--void);color:var(--bone);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#gl.drag{cursor:grabbing}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 48%,transparent 55%,rgba(0,0,0,.6) 100%)}
.flash{position:fixed;inset:0;pointer-events:none;background:#fff3e2;opacity:0;mix-blend-mode:screen}

.hud{position:fixed;inset:0;display:grid;pointer-events:none;
  grid-template-columns:minmax(240px,300px) minmax(0,1fr) minmax(240px,292px);
  grid-template-rows:auto auto minmax(0,1fr) auto;
  grid-template-areas:"brand stage tele" "scen stage tele" "log stage tele" "deck deck deck";
  gap:14px 24px;
  padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(16px + env(safe-area-inset-bottom,0px))}
.hud>*{pointer-events:auto;min-width:0}
.hud>.stage{grid-area:stage;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:500}

.brand{grid-area:brand}
.brand-mark{font-family:var(--display);font-size:46px;line-height:.9;letter-spacing:.03em;margin:0;font-weight:400}
.brand-sub{margin-top:10px;font-size:12px;color:var(--dim);letter-spacing:.03em;line-height:1.5}
.brand-sub b{color:var(--bone-2);font-weight:500}

.scen{grid-area:scen;display:flex;flex-direction:column;gap:6px}
.sc{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:12px;padding:10px 12px;
  background:rgba(9,9,12,.5);border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:border-color .2s,background-color .2s}
.sc:hover{border-color:var(--line-hi)}
.sc[aria-pressed="true"]{border-color:var(--ember);background:rgba(255,77,26,.09)}
.sc:focus-visible,.btn:focus-visible{outline:1px solid var(--ember);outline-offset:2px}
.sc kbd{font-family:var(--mono);font-size:11px;color:var(--dim);border:1px solid var(--line);width:20px;height:20px;display:grid;place-items:center;margin-top:1px;box-sizing:border-box}
.sc[aria-pressed="true"] kbd{color:var(--ember);border-color:var(--ember)}
.sc-name{font-family:var(--display);font-size:19px;line-height:1.1;letter-spacing:.02em}
.sc-kick{font-size:12px;color:var(--dim);margin-top:3px}
.sc-blurb{grid-column:2;font-size:12.5px;line-height:1.45;color:var(--bone-2);margin-top:8px;display:none}
.sc[aria-pressed="true"] .sc-blurb{display:block}

.tele{grid-area:tele;align-self:start;padding:16px;display:flex;flex-direction:column;gap:16px}
.tele-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.12em;padding:4px 8px;border:1px solid currentColor;white-space:nowrap}
.chip[data-l="0"]{color:var(--frost)}
.chip[data-l="1"]{color:var(--sulfur)}
.chip[data-l="2"]{color:var(--ember)}
.chip[data-l="3"]{color:var(--void);background:var(--ember);border-color:var(--ember)}
.pop-v{font-family:var(--display);font-size:60px;line-height:.95;font-variant-numeric:tabular-nums;margin-top:6px}
.pop-u{font-size:13px;color:var(--dim);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:4px}
.pop-d{font-family:var(--mono);color:var(--ember);font-size:12px}
.rows{display:flex;flex-direction:column;gap:13px}
.row-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.val{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{position:relative;height:3px;background:var(--faint);margin-top:6px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--c,var(--bone))}
.bar.div::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--dim)}
.src{font-size:11px;line-height:1.5;color:var(--dim);border-top:1px solid var(--line);padding-top:12px;margin:0}

.log{grid-area:log;align-self:end;padding:10px 14px;display:flex;flex-direction:column}
.log-h{display:flex;justify-content:space-between;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.ev{display:grid;grid-template-columns:6px minmax(0,1fr);gap:1px 10px;padding:6px 0;opacity:.5}
.ev:first-of-type{opacity:1}
.ev i{grid-row:1/3;width:6px;height:6px;margin-top:5px;background:var(--c)}
.ev-t{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.ev-x{font-size:13px;line-height:1.35}

.deck{grid-area:deck;display:flex;align-items:center;gap:16px;padding:10px 14px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;height:34px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);font-size:12px;letter-spacing:.06em;color:var(--bone);font-family:var(--body);white-space:nowrap;transition:border-color .2s}
.btn:hover{border-color:var(--line-hi)}
.btn svg{width:15px;height:15px;flex:none}
.btn.play{width:46px;height:46px;padding:0;background:var(--ember);border-color:var(--ember);color:var(--void)}
.btn.play svg{width:18px;height:18px}
.btn[aria-pressed="true"]{border-color:var(--bone)}
.clock{min-width:196px}
.clock-t{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock-s{margin-top:2px}
.track{position:relative;flex:1;min-width:0;height:34px}
#scrub{-webkit-appearance:none;appearance:none;display:block;width:100%;height:34px;background:transparent;margin:0;cursor:pointer}
#scrub::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,var(--ember) var(--pct,0%),rgba(236,230,218,.16) var(--pct,0%))}
#scrub::-moz-range-track{height:3px;background:rgba(236,230,218,.16)}
#scrub::-moz-range-progress{height:3px;background:var(--ember)}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:3px;height:20px;background:var(--bone);margin-top:-8.5px;border:0}
#scrub::-moz-range-thumb{width:3px;height:20px;background:var(--bone);border:0;border-radius:0}
#scrub:focus-visible{outline:1px solid var(--ember);outline-offset:2px}
.ticks{position:absolute;left:1px;right:1px;top:50%;height:0;pointer-events:none}
.ticks i{position:absolute;top:6px;width:2px;height:6px;background:var(--c);transform:translateX(-1px)}
.spd{min-width:62px;font-family:var(--mono)}

@media (max-width:760px){
  .hud{grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto auto minmax(0,1fr) auto auto auto;
    grid-template-areas:"brand" "tele" "stage" "log" "scen" "deck";
    gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px))}
  .brand{display:flex;align-items:baseline;gap:12px}
  .brand-mark{font-size:30px}
  .brand-sub{margin:0}
  .brand-help{display:none}
  .tele{padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;align-items:end}
  .tele-head{grid-column:1/-1}
  .pop-v{font-size:34px;margin:0}
  .pop-u{font-size:12px}
  .rows{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
  .rows .lbl{font-size:9.5px;letter-spacing:.08em}
  .val{font-size:12.5px}
  .src{display:none}
  .log{padding:6px 10px}
  .log-h{display:none}
  .ev:nth-of-type(n+3){display:none}
  .ev-x{font-size:12.5px}
  .scen{flex-direction:row;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
  .scen::-webkit-scrollbar{display:none}
  .sc{flex:0 0 auto;width:150px;padding:8px 10px;column-gap:8px}
  .sc-blurb{display:none!important}
  .sc-name{font-size:15px}
  .sc-kick{font-size:11px}
  .deck{flex-wrap:wrap;gap:8px;padding:8px 10px}
  .track{order:9;flex:1 1 100%;height:28px}
  #scrub{height:28px}
  .clock{min-width:0;flex:1}
  .clock-t{font-size:17px}
  .btn .t{display:none}
  .btn{padding:0 10px}
  .btn.play{width:42px;height:42px}
}
@media (max-width:760px) and (max-height:640px){.log{display:none}}
@media (prefers-reduced-motion:reduce){.sc,.btn{transition:none}}
</style>

<canvas id="gl" role="img" aria-label="Dönen üç boyutlu Dünya; seçilen felaket senaryosu yüzeyde canlandırılıyor"></canvas>
<div class="vignette"></div>
<div class="flash" id="flash"></div>

<div class="hud">
  <header class="brand">
    <h1 class="brand-mark">SON GÜN</h1>
    <div class="brand-sub">Küresel felaket simülatörü<span class="brand-help"><br><b>Sürükle</b> döndür · <b>Kaydır</b> yakınlaş · <b>Boşluk</b> oynat</span></div>
  </header>

  <nav class="scen" id="scen" aria-label="Senaryolar"></nav>

  <section class="log panel" aria-label="Olay kaydı">
    <div class="log-h"><span class="lbl">Olay kaydı</span><span class="lbl" id="logN"></span></div>
    <div id="log" aria-live="polite"></div>
  </section>

  <div class="stage" id="stage"></div>

  <aside class="tele panel" aria-label="Küresel göstergeler">
    <div class="tele-head"><span class="lbl">Uygarlık durumu</span><span class="chip" id="level" data-l="0">NOMİNAL</span></div>
    <div>
      <div class="lbl">Dünya nüfusu</div>
      <div class="pop-v" id="popV">8,24</div>
      <div class="pop-u"><span id="popU">milyar insan</span><span class="pop-d" id="popD"></span></div>
    </div>
    <div class="rows">
      <div class="row"><div class="row-top"><span class="lbl">Sıcaklık farkı</span><span class="val" id="tempV">+0,0 °C</span></div><div class="bar div"><i id="tempB"></i></div></div>
      <div class="row"><div class="row-top"><span class="lbl">Güneş ışığı</span><span class="val" id="sunV">%100</span></div><div class="bar"><i id="sunB" style="--c:var(--sulfur)"></i></div></div>
      <div class="row"><div class="row-top"><span class="lbl">Partikül yükü</span><span class="val" id="dustV">0 Tg</span></div><div class="bar"><i id="dustB" style="--c:#b9a58c"></i></div></div>
      <div class="row"><div class="row-top"><span class="lbl">Şehir ışıkları</span><span class="val" id="litV">%100</span></div><div class="bar"><i id="litB" style="--c:#ffc27a"></i></div></div>
    </div>
    <p class="src" id="src"></p>
  </aside>

  <footer class="deck panel">
    <button class="btn play" id="play" aria-label="Duraklat"></button>
    <div class="clock"><div class="clock-t" id="clock">T− 10 dk</div><div class="lbl clock-s" id="clockS"></div></div>
    <div class="track"><input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Zaman çizelgesi"><div class="ticks" id="ticks"></div></div>
    <button class="btn spd" id="speed" aria-label="Oynatma hızı">1×</button>
    <button class="btn" id="restart" aria-label="Baştan oynat"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 8a5.5 5.5 0 1 0 1.8-4.1"/><path d="M2.5 2v3h3"/></svg><span class="t">Baştan</span></button>
    <button class="btn" id="sound" aria-pressed="false" aria-label="Sesi aç"></button>
  </footer>
</div>

}

  return {
    name: 'Carrington Dönüşü', kick: 'Güneş fırtınası · Dst ≈ −1.700 nT',

    dist: [[0, 1.3], [0.2, 1.2], [0.3, 1.05], [0.6, 1.1], [1, 1.15]],

      dust: [[0, 0], [1, 0]],

    },
    events: [
      [0.0, 'Güneş’te beyaz ışık parlaması · X sınıfı patlama', 'w'],
      [0.02, '8 dk 20 sn sonra: gündüz tarafında radyo kesintisi', 'w'],
      [0.07, 'Koronal kütle atımı Dünya’ya yöneldi · varış 17,6 saat', 'w'],
      [T0, 'ÇARPMA · manyetosfer sıkıştı, Dst ≈ −1.700 nT', 'c'],
      [0.3, 'Kutup ışıkları Karayipler’den görülüyor', 'i'],
      [0.35, 'Yüksek gerilim trafoları yanıyor · kuzey şebekeleri çöktü', 'c'],
      [0.45, 'Alçak yörünge uyduları kayıp · GPS devre dışı', 'c'],
      [0.55, 'Su arıtma, yakıt pompaları ve soğuk zincir durdu', 'c'],
      [0.7, 'Yedek trafo stoku tükendi · onarım yıllar alacak', 'w'],
      [0.85, 'Gıda ve ilaç dağıtımı çöktü', 'c'],
      [0.97, 'Ekvator kuşağındaki şebekeler kısmen ayakta', 'i']
    ],
    setup(){
      const rng = mulberry(31);
      cme = Array.from({ length: 1300 }, () => ({ l: rng() * 12, az: rng() * 6.283, u: Math.sqrt(rng()), k: rng() }));
      sats = Array.from({ length: 110 }, () => {
        const geo = rng() < 0.12;
        const R = geo ? 1.9 + rng() * 0.05 : 1.07 + rng() * 0.22;

    update(p, t){

function fmtT(s){
  const sign = s < 0 ? 'T− ' : 'T+ '; s = Math.abs(s);
  const pad = x => String(Math.floor(x)).padStart(2, '0');
  if (s < 60) return sign + Math.floor(s) + ' sn';
  if (s < 3600) return sign + Math.floor(s / 60) + ' dk ' + pad(s % 60) + ' sn';
  if (s < 86400) return sign + Math.floor(s / 3600) + ' sa ' + pad(s % 3600 / 60) + ' dk';
  if (s < 86400 * 60) return sign + Math.floor(s / 86400) + ' gün ' + Math.floor(s % 86400 / 3600) + ' sa';
  if (s < YR) return sign + Math.floor(s / 86400 / 30.4) + ' ay';
  return sign + (s / YR).toLocaleString('tr-TR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' yıl';
}
const nf = (v, d) => v.toLocaleString('tr-TR', { minimumFractionDigits: d, maximumFractionDigits: d });
const txt = (el, s) => { if (el._t !== s){ el.textContent = s; el._t = s; } };
const wid = (el, w, left) => { const k = w.toFixed(1) + '|' + (left ?? ''); if (el._w !== k){ el._w = k; el.style.width = w + '%'; if (left != null) el.style.left = left + '%'; } };
const LEVELS = ['NOMİNAL', 'UYARI', 'FELAKET', 'YOK OLUŞ EŞİĞİ'];

function buildTicks(){
  const tk = $('ticks'); tk.innerHTML = '';
  sc.events.forEach(([ep, , l]) => { const i = document.createElement('i'); i.style.left = (ep * 100) + '%'; i.style.setProperty('--c', LV[l]); tk.appendChild(i); });
}
let logKey = '';
function renderLog(){
  const evs = sc.events.filter(e => e[0] <= p + 1e-6);
  const key = cur + ':' + evs.length;
  if (key === logKey) return; logKey = key;
  const box = $('log'); box.innerHTML = '';
  evs.slice(-4).reverse().forEach(([ep, text, l]) => {
    const d = document.createElement('div'); d.className = 'ev';
    d.innerHTML = '<i></i><div class="ev-t"></div><div class="ev-x"></div>';
    d.querySelector('i').style.setProperty('--c', LV[l]);
    d.querySelector('.ev-t').textContent = fmtT(kf(sc.time, ep, true));
    d.querySelector('.ev-x').textContent = text;
    box.appendChild(d);
  });
  txt($('logN'), evs.length + ' / ' + sc.events.length);
}

function updateUI(st){
  const s = kf(sc.time, p, true);
  txt($('clock'), fmtT(s));
  const scrub = $('scrub');
  if (document.activeElement !== scrub || !scrubbing) scrub.value = Math.round(p * 1000);
  scrub.style.setProperty('--pct', (p * 100).toFixed(2) + '%');
  const pop = st.pop;
  if (pop >= 1){ txt($('popV'), nf(pop, 2)); txt($('popU'), 'milyar insan'); }
  else { txt($('popV'), nf(Math.round(pop * 1000), 0)); txt($('popU'), 'milyon insan'); }
  const loss = 8.24 - pop;
  txt($('popD'), loss < 0.0005 ? '' : '−' + (loss >= 1 ? nf(loss, 2) + ' milyar' : nf(Math.round(loss * 1000), 0) + ' milyon'));
  const tp = st.temp;
  txt($('tempV'), (tp < -0.05 ? '−' : '+') + nf(Math.abs(tp), 1) + ' °C');
  const tw = Math.min(50, Math.abs(tp) / 30 * 50);
  const tb = $('tempB'); tb.style.setProperty('--c', tp < 0 ? 'var(--frost)' : 'var(--ember)');
  wid(tb, tw, tp < 0 ? 50 - tw : 50);
  txt($('sunV'), '%' + nf(Math.round(st.sun), 0)); wid($('sunB'), st.sun);
  txt($('dustV'), nf(Math.round(st.dust), 0) + ' Tg'); wid($('dustB'), Math.log10(1 + st.dust) / Math.log10(20001) * 100);
  txt($('litV'), '%' + nf(st.lights, st.lights < 10 ? 1 : 0)); wid($('litB'), st.lights);
  const sev = Math.max((1 - pop / 8.24) / 0.5, Math.abs(tp) / 12, (1 - st.sun / 100) / 0.6, (1 - st.lights / 100) / 0.9);
  const lv = sev < 0.04 ? 0 : sev < 0.35 ? 1 : sev < 0.85 ? 2 : 3;
  const ch = $('level'); if (ch.dataset.l !== String(lv)){ ch.dataset.l = lv; ch.textContent = LEVELS[lv]; }
  txt($('clockS'), p >= 1 ? 'Simülasyon tamamlandı' : sc.name);
  renderLog();
}

function setScenario(i){
  cur = i; sc = SCEN[i];
  fx.children.slice().forEach(c => { fx.remove(c); c.geometry && c.geometry.dispose(); c.material && c.material.dispose(); });
  sc.setup();
  p = 0; playing = true; logKey = '';
  sunTarget.set(...sc.sun).normalize();
  $('flash').style.background = sc.flashCol;
  [...scenNav.children].forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
  txt($('src'), sc.src);
  buildTicks(); syncPlay();
}

/* ---------- audio ---------- */
let AC = null, rumbleG = null, rumbleF = null, noiseBuf = null, soundOn = false, lastBoom = 0, prevFlash = 0;
function initAudio(){
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const len = AC.sampleRate * 3; noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); let last = 0;
  for (let i = 0; i < len; i++){ last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  rumbleF = AC.createBiquadFilter(); rumbleF.type = 'lowpass'; rumbleF.frequency.value = 120;
  rumbleG = AC.createGain(); rumbleG.gain.value = 0;
  src.connect(rumbleF).connect(rumbleG).connect(AC.destination); src.start();
}
function boom(k){
  if (!AC || !soundOn) return;
  const t = AC.currentTime, s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(50, t + 2.5);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.001, 1.4 * k), t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + 3.3);
}
$('sound').addEventListener('click', () => {
  soundOn = !soundOn;
  try {
    if (soundOn){ if (!AC) initAudio(); AC.resume(); }
    else if (AC) AC.suspend();
  } catch (e){ soundOn = false; }
  syncSound();
});

/* ---------- controls ---------- */
$('play').addEventListener('click', togglePlay);
function togglePlay(){
  if (p >= 1){ p = 0; logKey = ''; playing = true; }
  else playing = !playing;
  syncPlay();
}
$('restart').addEventListener('click', () => { p = 0; logKey = ''; playing = true; syncPlay(); });
$('speed').addEventListener('click', () => { speedIdx = (speedIdx + 1) % SPEEDS.length; txt($('speed'), SPEEDS[speedIdx].toLocaleString('tr-TR') + '×'); });
let scrubbing = false;
const scrubEl = $('scrub');
scrubEl.addEventListener('input', () => { scrubbing = true; p = scrubEl.value / 1000; logKey = ''; if (p < 1 && !playing) syncPlay(); });
scrubEl.addEventListener('change', () => { scrubbing = false; });
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (e.key >= '1' && e.key <= '4'){ setScenario(+e.key - 1); return; }
  if (tag === 'BUTTON' || tag === 'INPUT') return;
  if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight'){ p = Math.min(1, p + 0.02); logKey = ''; }
  else if (e.key === 'ArrowLeft'){ p = Math.max(0, p - 0.02); logKey = ''; }
});

/* orbit by pointer */
const ptrs = new Map(); let pinch0 = 0;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); canvas.classList.add('drag'); cam.lastUser = tReal;
  if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); } });
canvas.addEventListener('pointermove', e => {
  const pt = ptrs.get(e.pointerId); if (!pt) return;
  const dx = e.clientX - pt.x, dy = e.clientY - pt.y; pt.x = e.clientX; pt.y = e.clientY;
  cam.lastUser = tReal;
  if (ptrs.size === 1){ cam.uYaw -= dx * 0.005; cam.uPitch += dy * 0.004; }
  else if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch0 > 0) cam.uZoom = clamp(cam.uZoom - Math.log(d / pinch0), -0.9, 0.9); pinch0 = d; }
});
const endPtr = e => { ptrs.delete(e.pointerId); if (!ptrs.size) canvas.classList.remove('drag'); pinch0 = 0; };
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.uZoom = clamp(cam.uZoom + e.deltaY * 0.0012, -0.9, 0.9); cam.lastUser = tReal; }, { passive: false });

/* ---------- layout: center the globe in the free stage ---------- */
function layout(){
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  const r = $('stage').getBoundingClientRect();
  const cx = r.width > 40 ? r.left + r.width / 2 : W / 2, cy = r.height > 40 ? r.top + r.height / 2 : H / 2;
  camera.setViewOffset(W, H, W / 2 - cx, H / 2 - cy, W, H);
  camera.updateProjectionMatrix();
  SCALE.value = renderer.getPixelRatio() * H / (2 * FOV_T);
  const R = 0.45 * Math.max(160, Math.min(r.width || W, r.height || H));
  cam.fit = Math.sqrt(1 + Math.pow(H / 2 / FOV_T / R, 2));
}
addEventListener('resize', layout);
if (window.ResizeObserver) new ResizeObserver(layout).observe($('stage'));

/* ---------- frame ---------- */
const flashEl = $('flash');
let last = performance.now();
const angOf = v => Math.atan2(v.x, v.z);
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));

function step(dt){
  eU.uTime.value = tReal;
  const st = {
    pop: kf(sc.stats.pop, p), temp: kf(sc.stats.temp, p), sun: kf(sc.stats.sun, p),
    dust: kf(sc.stats.dust, p), lights: kf(sc.stats.lights, p)
  };
  F.hits = 0; F.flash = 0; F.shake = 0; F.rumble = 0; F.sunBoost = 0;
  asteroid.visible = false;
  SUN.lerp(sunTarget, Math.min(1, dt * 2.5)).normalize();
  eU.uLights.value = st.lights / 100; eU.uBlackLat.value = 1.2;
  eU.uAsh.value = clamp(1 - st.sun / 100, 0, 1);
  eU.uFreeze.value = clamp(-st.temp / 28, 0, 1);
  eU.uHeat.value = 0; eU.uRingA.value = 0; eU.uRing2A.value = 0;
  cU.uAshG.value = 0; cU.uAshL.value = 0; cU.uAshSpread.value = 0;
  auU.uAur.value = 0.3; auU.uAurLat.value = 0.93;

  sc.update(p, tReal, dt);

  eU.uHitCount.value = F.hits;
  const dusty = clamp(Math.max(eU.uAsh.value, cU.uAshG.value), 0, 1);
  eU.uAtmo.value.setRGB(0.3, 0.55, 1.0).lerp(_c.copy(cU.uAshTint.value).multiplyScalar(2.2), dusty * 0.85);
  sunLight.position.copy(SUN);

  GW.add(SUN.x * 300, SUN.y * 300, SUN.z * 300, 26 * (1 + F.sunBoost * 3), 1, 0.93, 0.8, 1);
  GW.add(SUN.x * 300, SUN.y * 300, SUN.z * 300, 110 * (1 + F.sunBoost * 2), 1, 0.7, 0.45, 0.22 + F.sunBoost * 0.5);

  /* earth + camera */
  const target = -angOf(sc.focus) + sc.spin * (p - sc.pf);
  cam.rotY += wrap(target - cam.rotY) * Math.min(1, dt * 2.5);
  earth.rotation.y = cam.rotY;
  const lat = Math.asin(clamp(sc.focus.y, -1, 1));
  cam.pitch += (lat * sc.pitchK - cam.pitch) * Math.min(1, dt * 2);
  const dTarget = cam.fit * kf(sc.dist, p);
  cam.dist += (dTarget - cam.dist) * Math.min(1, dt * 1.5);
  if (tReal - cam.lastUser > 8){ const k = Math.exp(-dt * 0.5); cam.uYaw *= k; cam.uPitch *= k; cam.uZoom *= k; }
  const yaw = cam.uYaw, pitch = clamp(cam.pitch + cam.uPitch, -1.4, 1.4), dist = Math.max(1.25, cam.dist * Math.exp(cam.uZoom));
  const sh = RM ? 0 : Math.min(F.shake, 0.05);
  camera.position.set(dist * Math.cos(pitch) * Math.sin(yaw), dist * Math.sin(pitch), dist * Math.cos(pitch) * Math.cos(yaw));
  camera.lookAt((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh, 0);

  GS.flush(); GA.flush(); GW.flush();

  const fl = clamp(F.flash, 0, 1) * (RM ? 0.3 : 1);
  flashEl.style.opacity = fl.toFixed(3);
  if (soundOn && AC){
    const now = AC.currentTime;
    rumbleG.gain.setTargetAtTime(clamp(F.rumble, 0, 1) * 0.55, now, 0.15);
    rumbleF.frequency.setTargetAtTime(80 + clamp(F.rumble, 0, 1) * 420, now, 0.2);
    if (F.flash > prevFlash + 0.12 && tReal - lastBoom > 0.12){ boom(clamp(F.flash, 0.2, 1)); lastBoom = tReal; }
  }
  prevFlash = F.flash;
  updateUI(st);
}
const _c = new THREE.Color();

function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now; tReal += dt;
  if (playing && !scrubbing){
    p += dt * SPEEDS[speedIdx] / sc.dur;
    if (p >= 1){ p = 1; playing = false; syncPlay(); }
  }
  step(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
const img = new Image();
img.onload = () => {
  const c = document.createElement('canvas'); c.width = 360; c.height = 180;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, 360, 180);
  maskData = x.getImageData(0, 0, 360, 180).data;
  const tex = new THREE.Texture(img); tex.anisotropy = renderer.capabilities.getMaxAnisotropy(); tex.needsUpdate = true;
  eU.uMap.value = tex;
  start();
};
img.onerror = start;
img.src = EARTH_TEX;
let started = false;
function start(){
  if (started) return; started = true;
  layout(); syncSound(); setScenario(0);
  cam.rotY = -angOf(sc.focus) + sc.spin * (0 - sc.pf);
  cam.pitch = Math.asin(sc.focus.y) * sc.pitchK;
  cam.dist = cam.fit * kf(sc.dist, 0) * 1.4;
  requestAnimationFrame(t => { last = t; frame(t); });
}
})();
</script>
